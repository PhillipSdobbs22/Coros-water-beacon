<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" width="780" height="690" role="img" aria-label="Beacon state machine: DRY to WET_SHALLOW to CONFIRMING to BEACON to BEACON_RESERVE to DEPLETED, with a CANCELLED exit and reset paths back to earlier states." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Water Recovery Mode — beacon state machine</title>
  <rect x="0" y="0" width="780" height="690" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33414f"/>
    </marker>
    <style>
      .bx  { fill:#f3f6f9; stroke:#33414f; stroke-width:1.6; }
      .bxa { fill:#fdf2d6; stroke:#8a6a17; stroke-width:1.8; }
      .bxt { fill:#efefef; stroke:#78818a; stroke-width:1.4; }
      .st  { font:600 14px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#16212b; }
      .sta { font:600 14px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#4a3808; }
      .stt { font:600 14px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#3f474e; }
      .sub { font:400 11px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#5a6773; }
      .lb  { font:400 12px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#33414f; }
      .lbs { font:400 11px ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; fill:#6b7883; }
      .ar  { stroke:#33414f; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .arf { stroke:#8a6a17; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .arr { stroke:#8b95a0; stroke-width:1.3; fill:none; stroke-dasharray:4 3; marker-end:url(#a); }
    </style>
  </defs>

  <text x="30" y="30" class="st" font-size="15">Water Recovery Mode — beacon state machine</text>
  <text x="30" y="48" class="sub">bb_on_sample() drives the left column at 4–8 Hz · bb_on_tick() drives the LED at 100 Hz</text>

  <rect class="bx"  x="230" y="70"  width="280" height="54" rx="6"/>
  <text x="370" y="94"  class="st"  text-anchor="middle">DRY</text>
  <text x="370" y="112" class="sub" text-anchor="middle">armed, waiting · barometer at 4 Hz</text>

  <rect class="bx"  x="230" y="180" width="280" height="54" rx="6"/>
  <text x="370" y="204" class="st"  text-anchor="middle">WET_SHALLOW</text>
  <text x="370" y="222" class="sub" text-anchor="middle">submerged · barometer boosts to 8 Hz</text>

  <rect class="bx"  x="230" y="290" width="280" height="54" rx="6"/>
  <text x="370" y="314" class="st"  text-anchor="middle">CONFIRMING</text>
  <text x="370" y="332" class="sub" text-anchor="middle">past threshold · debounce running</text>

  <rect class="bxa" x="230" y="400" width="280" height="54" rx="6"/>
  <text x="370" y="424" class="sta" text-anchor="middle">BEACON</text>
  <text x="370" y="442" class="sub" text-anchor="middle">100% brightness · primary flash pattern</text>

  <rect class="bxa" x="230" y="510" width="280" height="54" rx="6"/>
  <text x="370" y="534" class="sta" text-anchor="middle">BEACON_RESERVE</text>
  <text x="370" y="552" class="sub" text-anchor="middle">70% brightness · slow rescue flash</text>

  <rect class="bxt" x="230" y="620" width="280" height="46" rx="6"/>
  <text x="370" y="649" class="stt" text-anchor="middle">DEPLETED</text>

  <rect class="bxt" x="580" y="400" width="170" height="46" rx="6"/>
  <text x="665" y="429" class="stt" text-anchor="middle">CANCELLED</text>

  <path class="ar" d="M370,124 L370,176"/>
  <text x="384" y="146" class="lb">water contact, or depth ≥ 40 cm</text>
  <text x="384" y="162" class="lbs">splash, rain and hand-washing stop here</text>

  <path class="ar" d="M370,234 L370,286"/>
  <text x="384" y="256" class="lb">depth ≥ threshold</text>
  <text x="384" y="272" class="lbs">and wrist-off, if that policy is selected</text>

  <path class="arf" d="M370,344 L370,396"/>
  <text x="384" y="366" class="lb">6 consecutive samples @ 8 Hz</text>
  <text x="384" y="382" class="lbs">750 ms of continuous depth — then it latches</text>

  <path class="arf" d="M370,454 L370,506"/>
  <text x="384" y="476" class="lb">charge remaining ≤ 25%</text>
  <text x="384" y="492" class="lbs">compared on raw charge, not integer percent</text>

  <path class="ar" d="M370,564 L370,616"/>
  <text x="384" y="592" class="lb">budget exhausted</text>

  <path class="ar" d="M510,427 L576,427"/>
  <text x="543" y="418" class="lbs" text-anchor="middle">long</text>
  <text x="543" y="464" class="lbs" text-anchor="middle">press</text>
  <path class="ar" d="M510,537 C550,537 560,470 576,450"/>

  <path class="arr" d="M230,320 L180,320 L180,210 L226,210"/>
  <text x="170" y="270" class="lbs" text-anchor="end">depth lost:</text>
  <text x="170" y="284" class="lbs" text-anchor="end">counter resets to 0</text>

  <path class="arr" d="M230,225 L130,225 L130,100 L226,100"/>
  <text x="120" y="167" class="lbs" text-anchor="end">dry again</text>

  <text x="30" y="682" class="lbs">Shaded states drive the LED. Once BEACON is entered, only a long press or a flat battery leaves it.</text>
</svg>
